---
# Install and configure ZooKeeper

- name: Download ZooKeeper
  get_url:
    url: "https://archive.apache.org/dist/zookeeper/zookeeper-{{ zookeeper_version }}/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    dest: "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    mode: '0644'
    timeout: 60

- name: Extract ZooKeeper
  unarchive:
    src: "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    dest: /opt
    remote_src: yes
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    creates: "/opt/apache-zookeeper-{{ zookeeper_version }}-bin"

- name: Create ZooKeeper symlink
  file:
    src: "/opt/apache-zookeeper-{{ zookeeper_version }}-bin"
    dest: "{{ zookeeper_home }}"
    state: link
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    force: yes

- name: Create ZooKeeper data directory
  file:
    path: "{{ zookeeper_home }}/data"
    state: directory
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: '0755'

- name: Create ZooKeeper logs directory
  file:
    path: "{{ zookeeper_home }}/logs"
    state: directory
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: '0755'

- name: Set ZooKeeper myid
  template:
    src: myid.j2
    dest: "{{ zookeeper_home }}/data/myid"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: '0644'

- name: Configure zoo.cfg
  template:
    src: zoo.cfg.j2
    dest: "{{ zookeeper_home }}/conf/zoo.cfg"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_group }}"
    mode: '0644'

- name: Create ZooKeeper systemd unit
  copy:
    content: |
      [Unit]
      Description=ZooKeeper Server
      After=network.target

      [Service]
      Type=forking
      User={{ hadoop_user }}
      Group={{ hadoop_group }}
      Environment=ZOO_LOG_DIR={{ zookeeper_home }}/logs
      Environment=JAVA_HOME={{ java_home }}
      ExecStart={{ zookeeper_home }}/bin/zkServer.sh start
      ExecStop={{ zookeeper_home }}/bin/zkServer.sh stop
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/zookeeper.service
    mode: '0644'

- name: Enable and start ZooKeeper
  systemd:
    name: zookeeper
    daemon_reload: yes
    enabled: yes
    state: started

- name: Wait for ZooKeeper client port
  wait_for:
    port: "{{ zookeeper_port }}"
    timeout: 60

- name: Verify ZooKeeper status
  command: "{{ zookeeper_home }}/bin/zkServer.sh status"
  become_user: "{{ hadoop_user }}"
  register: zk_status
  changed_when: false
  failed_when: false

- name: Display ZooKeeper status
  debug:
    msg: "ZooKeeper status on {{ inventory_hostname }}: {{ zk_status.stdout }}"
